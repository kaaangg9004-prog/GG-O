<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101010"><title>GG-O · Cần kết nối Internet</title><style>body{margin:0;min-height:100vh;background:#101010;color:#fff;display:grid;place-content:center;font:16px Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;padding:24px}h1{font-size:clamp(28px,6vw,38px);line-height:1.5;letter-spacing:-1px;margin:20px 0;max-width:700px}b{color:#adff00}p{line-height:1.9;color:#bcbcbc;max-width:650px}a{display:inline-block;background:#adff00;color:#101010;text-decoration:none;padding:16px 24px;font-weight:bold}select{position:fixed;top:18px;right:18px;background:#fff;border:0;border-radius:4px;padding:9px;font:12px Arial;color:#101010}</style></head><body><select aria-label="Language"><option value="vi">🇻🇳 VIETNAM</option><option value="ko">🇰🇷 KOREAN</option><option value="en">🇬🇧 ENGLISH</option></select><main><b>GG-O</b><h1>Bạn có thể nghỉ một chút.</h1><p>Kết nối Internet bị gián đoạn. Hãy kiểm tra kết nối rồi thử lại.</p><a href="/">Kết nối lại ↗</a></main><script>
const copy={vi:['Cần kết nối Internet','Bạn có thể nghỉ một chút.','Kết nối Internet bị gián đoạn. Hãy kiểm tra kết nối rồi thử lại.','Kết nối lại ↗','Chọn ngôn ngữ'],ko:['인터넷 연결이 필요해요','잠시 쉬어 가도 괜찮아요.','인터넷 연결이 끊겼습니다. 연결을 확인한 뒤 다시 열어 주세요.','다시 연결하기 ↗','언어 선택'],en:['Internet connection needed','Take a little break.','Your Internet connection was interrupted. Check your connection and try again.','Reconnect ↗','Choose language']};
const select=document.querySelector('select');
function update(language){const text=copy[language]||copy.vi;document.documentElement.lang=language;document.title='GG-O · '+text[0];document.querySelector('h1').textContent=text[1];document.querySelector('p').textContent=text[2];document.querySelector('a').textContent=text[3];select.value=language;select.setAttribute('aria-label',text[4]);}
let language='vi';try{const saved=localStorage.getItem('ggo-language-v1');if(copy[saved])language=saved;}catch{}update(language);select.addEventListener('change',()=>{update(select.value);try{localStorage.setItem('ggo-language-v1',select.value);}catch{}});
</script></body></html>
